<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NC General Assembly — Carolina Election Map</title>
    <meta name="description" content="Every North Carolina General Assembly seat, ordered by partisan lean, with a generic ballot slider." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Locke brand standard: Barlow Condensed for display, Effra for body.
         Barlow Condensed is served from Google Fonts; Effra is licensed and not
         available there, so Mulish stands in for it. Swap Mulish for the real
         Effra webfonts when they are available (see --font-body in styles.css). -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Page-level resets for the standalone site only. The bundled stylesheet is
         scoped to its own container so it cannot restyle a WordPress theme, which
         means these have to live here where the plugin will never see them. -->
    <style>
      html, body { min-height: 100%; }
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-seats.jsx"></script>
  </body>
</html>
