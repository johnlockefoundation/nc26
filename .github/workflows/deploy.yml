name: Deploy

# Publishes the static site to GitHub Pages on every push to main, so gh-pages
# can never drift from main the way a manual deploy does. The build is fully
# reproducible from committed seed + drop files: the SQLite database is
# gitignored, so the workflow ingests from scratch rather than shipping a
# binary.
on:
  push:
    branches: [main]
  workflow_dispatch:

# contents: write for the Pages API. id-token: write lets actions/deploy-pages
# mint the OIDC token it presents to GitHub Pages -- without it the deploy job
# fails with "Ensure GITHUB_TOKEN has permission id-token: write".
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite (used throughout the backend) needs Node 22+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The database is gitignored, so a clean checkout has none. Build it from
      # the committed seed and drop files before exporting. Without this the
      # export runs against an empty database.
      - name: Ingest from seed data
        run: npm run ingest

      # Export the database as the static JSON the site reads, then build.
      # Supabase is a live overlay on the Pages demo, the same as in WordPress.
      # The anon key is designed to be public: PostgREST requires it on every
      # request, and it grants nothing by itself because every table has RLS on
      # with SELECT-only policies for anon. If these are absent the build still
      # succeeds and the site renders from bundled data alone, so they are
      # passed through rather than asserted on -- a missing key should degrade
      # the page, not break the deploy.
      - name: Export static data and build site
        run: npm run build:pages -w frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_CYCLE: ${{ vars.VITE_CYCLE }}

      # A guard rather than a test suite: fail the deploy if the export is
      # missing something the page would then fetch and 404 on.
      - name: Verify export
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          test -f frontend/dist/seats.html
          test -f frontend/dist/demo-data/meta.json
          test -f frontend/dist/demo-data/ticker.json
          test -f frontend/dist/demo-data/outline.json
          for t in us_house us_senate state_house state_senate; do
            test -f "frontend/dist/demo-data/map/$t.json"
          done
          for d in NC-SEN NC-01 SD-42 HD-105; do
            test -f "frontend/dist/demo-data/race/$d.json"
          done
          echo "race files: $(ls frontend/dist/demo-data/race | wc -l)"

      # Guard against the class of bug this repo already shipped once: a mock
      # dataset freezing into the published export. These keys are read live from
      # Supabase, so if any of them reappears in a bundled file, something has
      # put invented or stale figures back on the page.
      - name: Verify no bundled live data
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const volatile = ["polls", "poll_detail", "markets", "market_list",
                              "money", "state_funds", "vitals", "news", "coverage", "last_updated"];
            const offenders = [];
            let checked = 0;
            // The map files carry a races array too, and they need checking for
            // the same reason the per-seat files do: getMapFeatures() returns a
            // volatile block per race, and the demo exporter shipped the map
            // unstripped for a while, which published a market_weekly_move delta
            // computed from the local database. Scanning only race/ meant the
            // guard passed while the map contradicted Supabase.
            for (const dir of ["./frontend/dist/demo-data/race", "./frontend/dist/demo-data/map"]) {
              for (const f of fs.readdirSync(dir)) {
                const doc = JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8"));
                const records = Array.isArray(doc.races) ? doc.races : [doc];
                for (const [i, race] of records.entries()) {
                  checked++;
                  const where = `${dir.replace("./frontend/dist/", "")}/${f}${records.length > 1 ? `#${i}` : ""}`;
                  for (const k of volatile) {
                    if (race[k] != null) offenders.push(`${where}: ${k}`);
                  }
                  if (JSON.stringify(race).includes("is_mock")) offenders.push(`${where}: is_mock marker`);
                }
              }
            }
            if (offenders.length) {
              throw new Error("live data must not be bundled:\n  " + offenders.slice(0, 20).join("\n  "));
            }
            console.log(`no live keys bundled across ${checked} bundled records`);
          '

      # A read function can be reverted by re-running an older migration over a
      # newer one, and the symptom is a page that still renders but silently
      # loses a feature: 20261003190000 also defines map_payload, at a revision
      # with no markets delta, so applying it after 20261003240000 removed every
      # arrow from the map with nothing failing. Nothing in this workflow applies
      # migrations, so this asks the deployed endpoint what it actually returns.
      #
      # Deliberately not pg_get_functiondef: that needs a Postgres client this
      # job does not have, and asserting on the returned payload catches the same
      # bug for the same reason -- a stale map_payload returns no delta at all.
      - name: Verify the deployed read functions
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "supabase not configured; skipping the deployed-read check"
            exit 0
          fi
          body=$(curl -sS --fail \
            "$VITE_SUPABASE_URL/rest/v1/rpc/map_payload?p_race_type=us_house&p_cycle=2026" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY")
          echo "$body" > /tmp/jce-map-payload.json
          node -e '
            const d = JSON.parse(require("fs").readFileSync("/tmp/jce-map-payload.json", "utf8"));
            const races = d.races || [];
            const withMarket = races.filter((r) => (r.markets || {}).available);
            const withDelta = races.filter((r) => (r.markets || {}).delta);
            const holder = races.filter((r) => r.partisan && "holder_party" in r.partisan);
            const fail = [];
            // At least one seat must carry a weekly move. NOT every seat with a
            // market: only four U.S. House seats have the two snapshots a week
            // apart that market_weekly_move needs, and the other ten correctly
            // show no arrow. Asserting one-per-market failed on live data for
            // exactly that reason. What the stale revision did was return no
            // delta anywhere, so zero is the number that means broken.
            if (!withDelta.length && withMarket.length) {
              fail.push(`no seat carries a markets delta, so the map has no arrows (${withMarket.length} seats have markets)`);
            }
            for (const r of withDelta) {
              const p = r.markets.delta.party;
              if (p !== "D" && p !== "R") fail.push(`${r.district_id}: delta party is ${JSON.stringify(p)}`);
            }
            // The seat holder is a bundled reference fact, so its absence here
            // means the deployed map_payload predates the column.
            if (!holder.length) fail.push("map_payload has no holder_party on any seat");
            if (fail.length) {
              throw new Error("deployed read functions are stale:\n  " + fail.join("\n  "));
            }
            console.log(`map_payload ok: ${withDelta.length} seats carry a delta, holder_party present on ${holder.length}`);
          '

          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
