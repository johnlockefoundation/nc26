AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Read-only HTTP proxy for a MySQL database, fronted by a Lambda Function URL.
  VPC-attached Lambda is the only thing that can reach the database. No API
  Gateway, no Secrets Manager, no WAF: credentials are encrypted Lambda env
  vars, and a reserved-concurrency cap protects the database.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that contains the RDS cluster.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for the Lambda.
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security group attached to the RDS cluster.
  DbHost:
    Type: String
    Default: carolinaelections-3.cluster-ro-cdq9qw5jzol8.us-east-1.rds.amazonaws.com
  DbPort:
    Type: Number
    Default: 3306
  DbName:
    Type: String
    Default: carolinaelections
  DbUser:
    Type: String
    Default: carolina_ro
  DbPassword:
    Type: String
    NoEcho: true
    Description: SELECT-only database user's password.
  ReservedConcurrency:
    Type: Number
    Default: 5
    Description: Max concurrent Lambda executions (protects the database).

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: nodejs22.x

Resources:
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: mysql proxy lambda
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
          # TODO (IT): tighten to the RDS SG if preferred.

  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  MysqlProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: index.handler
      FunctionUrlConfig:
        AuthType: NONE
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
      Policies:
        - VPCAccessPolicy: {}

Outputs:
  FunctionUrl:
    Description: Invoke URL for the proxy. POST {op, params}; GET for health.
    Value: !GetAtt MysqlProxyFunction.FunctionUrl
  FunctionName:
    Value: !Ref MysqlProxyFunction
  LambdaSecurityGroupId:
    Value: !Ref LambdaSecurityGroup